app-id: com.gosh.usb_creator
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: gosh-usb-creator
build-options:
  no-debuginfo: true
  strip: false
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.Notifications
  - --env=GTK_USE_PORTAL=1
modules:
  - name: gosh-usb-creator
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/gosh-usb-creator
      - cp -a bundle/. /app/lib/gosh-usb-creator/
      - install -Dm755 gosh-usb-creator /app/bin/gosh-usb-creator
      - install -Dm644 com.gosh.usb_creator.desktop /app/share/applications/com.gosh.usb_creator.desktop
      - install -Dm644 com.gosh.usb_creator.metainfo.xml /app/share/metainfo/com.gosh.usb_creator.metainfo.xml
      - install -Dm644 icon.png /app/share/icons/hicolor/128x128/apps/com.gosh.usb_creator.png
    sources:
      - type: dir
        path: ../../build/flatpak/bundle
        dest: bundle
      - type: file
        path: ../linux/gosh-usb-creator
      - type: file
        path: ../linux/com.gosh.usb_creator.desktop
      - type: file
        path: ../linux/com.gosh.usb_creator.metainfo.xml
      - type: file
        path: ../linux/icon.png
        dest-filename: icon.png
